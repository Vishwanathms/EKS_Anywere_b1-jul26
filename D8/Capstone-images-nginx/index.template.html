<!DOCTYPE html>
<html>

<head>
    <title>GitOps Demo</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .card{
            width:650px;
            margin:60px auto;
            padding:30px;
            border-radius:10px;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#1976d2;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:25px;
        }

        td{
            padding:10px;
            border-bottom:1px solid #ddd;
            font-size:20px;
        }

        td:first-child{
            font-weight:bold;
            width:220px;
        }

    </style>

</head>

<body>

<div class="card">

<h1>GitOps Demo Application</h1>

<table>

<tr>
<td>Company</td>
<td>${COMPANY}</td>
</tr>

<tr>
<td>Application</td>
<td>${APPLICATION}</td>
</tr>

<tr>
<td>Environment</td>
<td>${ENVIRONMENT}</td>
</tr>

<tr>
<td>Version</td>
<td>${VERSION}</td>
</tr>

<tr>
<td>Color Theme</td>
<td>${COLOR_THEME}</td>
</tr>

<tr>
<td>Build Date</td>
<td>${BUILD_DATE}</td>
</tr>

</table>

</div>

</body>

</html>
