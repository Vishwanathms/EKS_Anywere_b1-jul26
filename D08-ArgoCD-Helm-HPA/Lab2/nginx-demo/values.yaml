# Image

image:
  repository: vishwacloudlab/gitops-nginx
  tag: v1
  pullPolicy: Always

# Deployment

replicas: 2

# Application Information

company: Vishwacloudlab
application: GitOps Demo
environment: Development
version: v1.0.0
color: Blue
buildDate: "30-Jul-2026"

# Service

service:
  type: ClusterIP
  port: 80

# Ingress

ingress:
  enabled: true
  className: nginx

  host: gitops-student-XX.lab.local

  path: /